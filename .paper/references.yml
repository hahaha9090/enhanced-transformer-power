schema_version: "1.1"
status: "author_confirmed"
last_verified: "2026-07-20"
purpose: "记录VICQR论文中可复用的文献证据、原始网址、可支持主张及使用边界。"

usage_rules:
  - "正文使用文献前必须核对supports与does_not_support，不得仅凭标题扩展结论。"
  - "优先使用doi_url或publisher_url指向的一手来源；综述不得替代可获得的原始论文。"
  - "新发现且完成核验的文献应先写入本文件，再进入论文正文、claims.yml或蓝图。"
  - "新增文献若改变研究问题、模型定义、贡献、证据状态或结论强度，仍须先获得作者确认。"
  - "只有manuscript_approval.status为author_approved的文献可以进入论文正文；verified只表示元数据和支持边界已核验，不等于作者已批准使用。"
  - "蓝图使用BP-LIT-xx稳定陈述编号，references中的blueprint_links负责反向映射；Rxxx是内部文献ID，不得直接作为最终稿的参考文献编号。"

