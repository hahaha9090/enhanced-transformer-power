    evidence_batch: "latest_restored_aggregate"
    risk: "当前支持平均聚合层面的覆盖恢复，不支持所有市场、小时或状态单元均得到缓解；正式条件覆盖推断仍待可复核数据闭环。"
    allowed_wording: "最新聚合点估计表明，VICQR在描述性层面明显缓解平均高波动欠覆盖。"
    prohibited_wording: "VICQR已经在所有市场—小时单元中减少欠覆盖。"

