    category: "center_problem_tail_diagnosis"
    blueprint_anchor: "Section 4, tail imbalance"
    text: "旧本地完整批次的条件诊断显示，高波动状态下存在具有市场异质性的上下尾失误不平衡；该诊断用于解释可靠性下降机制，不作为最新恢复聚合主结果的精确数值结论。"
    evidence_artifacts:
