    allowed_wording: "VICQR is a redesigned conditional online interval-calibration model."
    prohibited_wording: "VICQR is a lightweight add-on that simply appends one quantile to OCQR."

  - id: C12
    category: "main_seven_market_effect"
    blueprint_anchor: "Section 8, current evidence"
    text: "最新恢复聚合点估计显示，VICQR在两个主要区间水平上均降低平均高波动Winkler分数并缩短区间，且两个水平下均有7/7市场获得负的Winkler变化。"
    evidence_artifacts:
      - "paper_outputs/results_tables/vicqr_v5_development/high_metrics.csv"
      - "paper_outputs/results_tables/vicqr_v5_development/recovered_effect_metrics.csv"
      - "paper_outputs/results_tables/vicqr_v5_development/validation_gate_audit.csv"
      - "paper_outputs/results_tables/vicqr_v5_development/protocol.json"
      - "paper_outputs/results_tables/vicqr_v5_development/artifact_hash_manifest.json"
    figure_or_table: ["Fig4", "Fig5", "Tab2"]
    status: "draft"
    current_evidence:
      - "alpha=0.2：平均高波动Winkler差值为-0.5300，相对改善约2.13%，平均宽度降低约1.86%，7/7市场为负。"
      - "alpha=0.4：平均高波动Winkler差值为-0.4159，相对改善约2.08%，平均宽度降低约2.13%，7/7市场为负。"
    evidence_batch: "latest_restored_aggregate"
    risk: "该主张可用于初稿的聚合点估计；正式配对统计推断和原始重采样分布不可用，不得添加significantly，也不得把重建后的逐市场幅度作为已复核真实明细。当前overall_metrics.csv未与恢复主结果同步，不能据此声称VICQR在当前批次保持总体覆盖。"
    allowed_wording: "最新七市场聚合点估计表明，VICQR改善高波动综合区间分数并缩短区间，两个主要水平的改善方向均为7/7。"
    prohibited_wording: "VICQR将高波动Winkler显著降低5.90%和6.88%。"
    required_tests:
