  - id: C13
    category: "conditional_undercoverage_effect_boundary"
    blueprint_anchor: "Section 4 and Section 8, coverage recovery"
    text: "最新恢复聚合点估计显示，VICQR将80%和60%区间的平均高波动覆盖率分别提高约4.32和4.47个百分点，使coverage gap缩小到约-0.59和-0.23个百分点。"
    evidence_artifacts:
