    figure_or_table: ["Tab3", "Fig3"]
    status: "rejected"
    rejection_reason: "该主张属于已淘汰VA-OCQR结果，不能替代VICQR的当前条件覆盖和校准证据。"
    sentence_in_manuscript: "The hourly diagnostics show that VA-OCQR keeps the Kupiec pass-hour performance at a level comparable to OCQR while improving the high-volatility gap."

  - id: C7
    category: "legacy_theoretical_overclaim"
    text: "VA-OCQR provides unconditional finite-sample validity for every volatility state."
    evidence_artifacts: []
    figure_or_table: []
    status: "rejected"
