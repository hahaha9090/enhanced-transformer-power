    blueprint_anchor: "Section 2, fixed VICQR definition"
    text: "VICQR是吸收经系统研究确认有效的在线边际校准原理，并重新构建状态表征、动作空间、证据评估和风险决策过程后形成的完整新模型。"
    evidence_artifacts:
