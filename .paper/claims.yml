  - id: C9
    category: "center_problem_diagnosis"
    blueprint_anchor: "Section 4, center problem"
    text: "最新恢复的七市场聚合点估计显示，OCQR在80%和60%预测区间上的平均高波动覆盖率分别约为75.09%和55.30%，相对名义覆盖率分别欠覆盖约4.91和4.70个百分点。"
    evidence_artifacts:
      - "paper_outputs/results_tables/vicqr_v5_development/high_metrics.csv"
      - "paper_outputs/results_tables/vicqr_v5_development/recovered_effect_metrics.csv"
      - "paper_outputs/results_tables/vicqr_v5_development/protocol.json"
      - "paper_outputs/results_tables/vicqr_v5_development/artifact_hash_manifest.json"
    figure_or_table: ["Fig1"]
    status: "draft"
    current_evidence:
      - "alpha=0.2：OCQR平均高波动覆盖率约75.09%，coverage gap约-4.91个百分点。"
      - "alpha=0.4：OCQR平均高波动覆盖率约55.30%，coverage gap约-4.70个百分点。"
    evidence_batch: "latest_restored_aggregate"
    risk: "这些值是服务器原始明细丢失后依据保留实验摘要恢复的聚合点估计；可以用于当前初稿的问题量化，但不能替代正式条件覆盖检验，也不能使用约束重建的市场—小时单元扩写局部结论。"
    literature_refs: ["R001", "R002", "R003", "R005"]
    allowed_wording: "最新七市场聚合点估计表明，OCQR在两个主要区间水平上均存在平均高波动欠覆盖。"
    prohibited_wording: "OCQR在七个市场的全部高波动状态下系统性欠覆盖。"
    required_tests:
      - "使用可复核原始数据完成高波动聚合或预先定义子群的正式条件覆盖检验。"
      - "报告时间依赖稳健置信区间。"

