schema_version: "2.0"
paper_method: "VICQR"
updated: "2026-07-21"
source_blueprint: ".paper/blueprint.md v1.4"
status: "consistency_alignment_completed_for_current_manuscript"
purpose: "记录VICQR论文主张、证据产物、统计检验缺口、允许措辞和禁止扩写边界。"

status_definitions:
  supported: "现有产物能够直接支持当前限定措辞。"
  draft: "已有描述性或初步证据，但正式推断、措辞或展示方式尚未闭环。"
  gap: "论文希望提出该主张，但当前缺少足够证据；满足gap_reason前不得进入正文。"
  rejected: "旧模型、错误解释或过强主张；保留记录以防重新泄漏。"

evidence_policy:
  - "主张必须追溯到实际存在的结果、协议、审计或代码产物。"
  - "点估计与统计显著性严格分开；没有正式检验时不得使用显著、证明或保证。"
  - "外部文献只支撑领域事实、理论和评价规范，不能替代VICQR自身实验结果。"
  - "figure_or_table中的编号是蓝图规划编号，并与figures.yml保持双向一致；规划编号不表示图形已经渲染。"
  - "最新恢复聚合摘要可用于论文初稿点估计；约束重建的市场—小时数值、未同步的辅助表和不可复核的p值不得用于建立新主张。"

center_problem_evidence_gate:
  problem_existence:
    claim_ids: ["C9"]
    status: "restored_aggregate_undercoverage_point_estimates_available_formal_inference_pending"
    remaining_tests:
      - "高波动市场—小时条件覆盖的正式检验或置信区间。"
      - "必要的多重检验控制。"
  auxiliary_problem_mechanism:
    claim_ids: ["C10"]
    status: "legacy_complete_batch_supportive_tail_diagnosis_pending_alignment"
    remaining_tests:
      - "在与最新主结果一致的批次中复核上下尾失误和市场异质性。"
  model_improvement:
    claim_ids: ["C12", "C13", "C14"]
    status: "restored_aggregate_coverage_recovery_and_interval_score_improvement_available"
    remaining_tests:
      - "七市场高波动Winkler配对统计推断。"
      - "条件coverage gap与欠覆盖状态变化的正式统计支持。"
  no_unacceptable_tradeoff:
    claim_ids: ["C12", "C13", "C17"]
    status: "latest_aggregate_high_volatility_coverage_and_width_point_estimates_plus_prior_control_batch"
    remaining_tests:
      - "使用一致批次的overall coverage证明总体校准不存在不可接受恶化。"
      - "覆盖非劣效边界及其置信区间。"
      - "将风险门控控制实验与最终主结果批次对齐。"
  external_applicability:
    claim_ids: ["C19", "C21"]
    status: "supportive_only"
    remaining_tests:
      - "增加满足预设高波动样本门槛的外部市场或年份。"

claims:
  - id: C1
    category: "baseline_context"
    text: "Baseline OCQR reproduces the main calibration advantage of the preserved PefCodeBench-style experiment frame, especially in hourly Kupiec pass counts relative to CP, QR, and CQR."
    evidence_artifacts:
      - "paper_outputs/results_tables/ocq_vs_baselines_summary.csv"
      - "paper_outputs/results_tables/summary_all_markets_mean_kpis.csv"
      - "paper_outputs/results_tables/paper_main_table_selected_methods.csv"
      - "paper_outputs/word/revised_paper_framework_v2.docx"
    figure_or_table: ["Tab2"]
    status: "draft"
    risk: "该主张仍可作为OCQR基准复现背景，但数据来自早期论文框架；进入VICQR正文前需与当前冻结开发划分和最终基线表重新对齐。"
    allowed_wording: "OCQR在保留的基准框架中表现出具有竞争力的在线边际校准能力。"
    prohibited_wording: "OCQR在所有指标和覆盖水平上均为最佳方法。"
    sentence_in_manuscript: "The reproduced baseline shows that OCQR improves the calibration-oriented indicators over the non-adaptive baselines, particularly the number of hours passing the Kupiec coverage test."

  - id: C2
    category: "legacy_problem_statement"
    text: "The preserved OCQR baseline still exhibits conditional undercoverage under high-volatility samples across the seven-market frame."
    evidence_artifacts:
      - "paper_outputs/results_tables/volatility_diagnosis/high_volatility_summary_selected_methods.csv"
      - "paper_outputs/results_tables/volatility_diagnosis/volatility_group_summary_selected_methods.csv"
      - "paper_outputs/results_tables/volatility_diagnosis_va/high_volatility_summary_va_methods.csv"
    figure_or_table: ["Tab2", "Fig1"]
    status: "rejected"
    rejection_reason: "该句属于旧VA-OCQR论文语境，不能直接进入VICQR正文。最新恢复聚合摘要中的等价VICQR问题诊断由C9重新记录，并保留当前数据来源与推断边界。"
    replacement_claims: ["C9", "C10"]
    sentence_in_manuscript: "Although OCQR is competitive on the aggregate frame, the high-volatility subset remains systematically below the target coverage level."

  - id: C3
    category: "legacy_va_ocqr"
    text: "VA-OCQR is an independent volatility-aware post-processing calibration method and does not replace or retrain the neural forecasting backbone."
    evidence_artifacts:
      - "exec_va_calibration.py"
      - "export_va_results.py"
      - "tools/volatility_calibration_tools.py"
      - "paper_outputs/results_tables/volatility_diagnosis_va/baseline_integrity_hashes.csv"
      - ".research/design_brief.md"
    figure_or_table: []
    status: "rejected"
    rejection_reason: "VA-OCQR不再是论文方法对象；当前论文方法已锁定为完整新模型VICQR。"
    replacement_claims: ["C11"]
    sentence_in_manuscript: "The proposed method is applied after the saved quantile forecasts are produced, so the comparison isolates the calibration rule rather than a new forecasting backbone."

  - id: C4
    category: "legacy_va_ocqr"
    text: "On the full seven-market evaluation, VA-OCQR moves high-volatility coverage gaps closer to zero than OCQR at alpha = 0.2 and alpha = 0.4 while keeping Winkler scores close to the OCQR baseline."
    evidence_artifacts:
      - "paper_outputs/results_tables/volatility_diagnosis_va/publication_claim_audit.md"
      - "paper_outputs/results_tables/volatility_diagnosis_va/high_volatility_summary_va_methods.csv"
      - "paper_outputs/results_tables/volatility_diagnosis_va/volatility_group_summary_va_methods.csv"
      - "paper_outputs/figures/va_experiment/coverage_gap_high_volatility.png"
      - "paper_outputs/figures/va_experiment/winkler_high_volatility.png"
    figure_or_table: ["Tab2", "Fig1", "Fig2"]
    status: "rejected"
    rejection_reason: "该主张属于已淘汰VA-OCQR实验，不得用于VICQR效果证明。"
    sentence_in_manuscript: "At alpha = 0.2 and 0.4, VA-OCQR reduces the high-volatility coverage gap from -0.0476 to -0.0126 and from -0.0430 to -0.0016, respectively, with Winkler scores remaining close to OCQR."

  - id: C5
    category: "legacy_va_ocqr"
    text: "The negative-control widening experiment suggests that the improvement is not merely a global widening effect, because uniform widening creates substantially larger low/mid-volatility spillover."
    evidence_artifacts:
      - "paper_outputs/results_tables/volatility_diagnosis_va/negative_control_global_widening_summary.csv"
      - "paper_outputs/results_tables/volatility_diagnosis_va/negative_control_global_widening.csv"
      - "paper_outputs/figures/va_experiment/negative_control_low_mid_width.png"
    figure_or_table: ["Tab4", "Fig4"]
    status: "rejected"
    rejection_reason: "该负对照属于VA-OCQR阶段；VICQR论文需使用当前VICQR状态、证据融合和风险门控控制实验。"
    replacement_claims: ["C15", "C16", "C17"]
    sentence_in_manuscript: "The widening control attains similar high-volatility gap reduction, but its low/mid-volatility absolute gap and width increase much more than VA-OCQR."

  - id: C6
    category: "legacy_va_ocqr"
    text: "VA-OCQR maintains strong hourly calibration reliability in the seven-market frame, with average Kupiec passed hours comparable to OCQR."
    evidence_artifacts:
      - "paper_outputs/results_tables/volatility_diagnosis_va/kupiec_passed_hours_summary_va_methods.csv"
      - "paper_outputs/results_tables/volatility_diagnosis_va/hourly_picp_va_methods.csv"
      - "paper_outputs/figures/va_experiment/hourly_picp_ocqr_vs_va.png"
