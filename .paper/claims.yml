    risk: "旧完整批次尚未与最新恢复聚合主结果对齐。尾部不平衡只能作为初稿中的机制性辅助观察，最终定量表述应等待一致批次证据。"
    allowed_wording: "旧完整批次的辅助诊断提示，OCQR高波动失误具有上下尾与市场异质性。"
    prohibited_wording: "尾部不平衡已经证明OCQR在所有高波动状态下欠覆盖。"

  - id: C11
